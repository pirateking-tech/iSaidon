<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub - Private Admin Control</title>
    
    <!-- FIX: Reads your custom supabase.js file locally from your GitHub repository -->
    <script src="supabase.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 { 
            margin-top: 0; 
            color: #E50914; 
            font-size: 24px;
        }
        p {
            color: #b3b3b3;
            font-size: 14px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #e5e5e5;
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border-radius: 4px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #E50914;
            outline: none;
        }
        select option { 
            background: #1e1e1e; 
        }
        button { 
            background: #E50914; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 25px; 
            transition: background 0.2s; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover { 
            background: #b80710; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 Admin Control Dashboard</h2>
    <p>Upload StreamTape links directly to the cloud server database</p>
    
    <form id="uploadForm">
        <label for="movieTitle">Movie Title:</label>
        <input type="text" id="movieTitle" placeholder="Enter Movie Title (e.g., Leo 2023)" required>

        <label for="movieCategory">Select Category:</label>
        <select id="movieCategory">
            <option value="Tamil Dubbed Movies">Tamil Dubbed Movies</option>
            <option value="Hollywood Movies">Hollywood Movies</option>
            <option value="Bollywood Movies">Bollywood Movies</option>
            <option value="Anime & Cartoons">Anime & Cartoons</option>
        </select>

        <label for="streamLink">Paste StreamTape Link:</label>
        <input type="url" id="streamLink" placeholder="https://streamtape.com..." required>

        <button type="submit">Publish to Cloud Website</button>
    </form>
</div>

<script>
    // ⚠️ PASTE YOUR EXACT SUPABASE CREDENTIALS HERE
   const SUPABASE_URL = "https://wmmwdaracogfvbpnwxgi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbXdkYXJhY29nZnZicG53eGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjIzMzEsImV4cCI6MjEwNzk5ODMzMX0.lQjAcTboJjIm0A8pqGQ1JsGIGcHH1qUfTXE3R8coB3A";
    
    window.addEventListener('DOMContentLoaded', () => {
        // Initialize the localized database connection bridge
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('movieTitle').value;
            const category = document.getElementById('movieCategory').value;
            const streamLink = document.getElementById('streamLink').value;

            // Push form values straight into your table structure layout
            const { data, error } = await dbClient
                .from('movies')
                .insert([{ title: title, category: category, stream_link: streamLink }]);

            if (error) {
                console.error("Database Write Failed:", error);
                alert("Failed to publish movie: " + error.message);
            } else {
                alert("🎉 Movie successfully published to the public portal!");
                document.getElementById('uploadForm').reset();
            }
        });
    });
</script>
</body>
</html>
