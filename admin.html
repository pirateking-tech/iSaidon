<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub - Private Admin Control</title>
    
    <!-- Local database script reference -->
    <script src="supabase.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { margin-top: 0; color: #E50914; font-size: 24px; }
        p { color: #b3b3b3; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #e5e5e5; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px; }
        input:focus, select:focus { border-color: #E50914; outline: none; }
        button { background: #E50914; border: none; font-weight: bold; cursor: pointer; margin-top: 25px; transition: background 0.2s; text-transform: uppercase; }
        button:hover { background: #b80710; }
        
        .manager-section { margin-top: 40px; border-top: 2px solid #333; padding-top: 20px; }
        .movie-list-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #444; }
        .movie-info { font-size: 14px; }
        .movie-info span { color: #888; font-size: 12px; display: block; }
        .delete-btn { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: auto; margin-top: 0; font-size: 14px; }
        .delete-btn:hover { background: #c9302c; }

        /* REWIRED LOGIN LAYER STYLE */
        #loginGate { display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; z-index: 9999; justify-content: center; align-items: center; }
        .login-box { max-width: 380px; width: 90%; background: #1e1e1e; border: 1px solid #333; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .login-box h3 { margin-top: 0; color: #E50914; font-size: 22px; }
        .error-txt { color: #d9534f; font-size: 13px; margin-top: 15px; display: none; }
        .logout-panel { display: flex; justify-content: flex-end; margin-bottom: -20px; }
        .logout-btn { background: #333; width: auto; font-size: 12px; padding: 6px 12px; margin: 0; color: #aaa; }
        .logout-btn:hover { background: #444; color: #fff; }
        
        /* Hidden layout panel default state */
        #mainContent { display: none; }
    </style>
</head>
<body>

<!-- AUTH GATEKEEPER PANEL -->
<div id="loginGate">
    <div class="login-box">
        <h3>🔐 Private Control Gate</h3>
        <p>Authentication required to access website management pipelines.</p>
        <form id="gateForm">
            <input type="password" id="gatePass" placeholder="Enter Secure Admin Password" required autofocus>
            <button type="submit">Verify Identity</button>
            <div id="loginError" class="error-txt">❌ Access Denied. Invalid Secret Key.</div>
        </form>
    </div>
</div>

<!-- DASHBOARD WRAPPER -->
<div id="mainContent" class="container">
    <div class="logout-panel">
        <button id="logoutBtn" class="logout-btn">🔒 Exit Session</button>
    </div>
    <h2>🔐 Admin Control Dashboard</h2>
    <p>Upload StreamTape links directly to the cloud server database</p>
    
    <form id="uploadForm">
        <label for="movieTitle">Movie Title:</label>
        <input type="text" id="movieTitle" placeholder="Enter Movie Title (e.g., Leo 2023)" required>

        <label for="movieCategory">Select Category:</label>
        <select id="movieCategory">
            <option value="Tamil Dubbed Movies">Tamil Dubbed Movies</option>
            <option value="Hollywood Movies">Hollywood Movies</option>
            <option value="Bollywood Movies">Bollywood Movies</option>
            <option value="Anime & Cartoons">Anime & Cartoons</option>
        </select>

        <label for="streamLink">Paste StreamTape Link:</label>
        <input type="url" id="streamLink" placeholder="https://streamtape.com..." required>

        <button type="submit">Publish to Cloud Website</button>
    </form>

    <div class="manager-section">
        <h2>🗑️ Remove Published Movies</h2>
        <div id="admin-movie-list">Loading active records...</div>
    </div>
</div>

<script>
    // ⚠️ DEFINE YOUR PASSCODE RULES AND ACCESS KEYS HERE
    const ADMIN_SECRET_KEY = "yunus"; // Put your password here!
    const SUPABASE_URL = "https://wmmwdaracogfvbpnwxgi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbXdkYXJhY29nZnZicG53eGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjIzMzEsImV4cCI6MjEwNzk5ODMzMX0.lQjAcTboJjIm0A8pqGQ1JsGIGcHH1qUfTXE3R8coB3A";

    window.addEventListener('DOMContentLoaded', () => {
        const loginGate = document.getElementById('loginGate');
        const mainContent = document.getElementById('mainContent');
        const loginError = document.getElementById('loginError');

        // Check if user has an active session right away
        if (sessionStorage.getItem('admin_login_auth') === "authenticated") {
            loginGate.style.display = 'none';
            mainContent.style.display = 'block';
            initializeDashboard();
        }

        // Handle password form submission
        document.getElementById('gateForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputPass = document.getElementById('gatePass').value;

            if (inputPass === ADMIN_SECRET_KEY) {
                sessionStorage.setItem('admin_login_auth', "authenticated");
                loginError.style.display = 'none';
                loginGate.style.display = 'none';
                mainContent.style.display = 'block';
                initializeDashboard();
            } else {
                loginError.style.display = 'block';
                document.getElementById('gatePass').value = '';
            }
        });

        // Exit / Clear Session logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_login_auth');
            window.location.reload();
        });

        function initializeDashboard() {
            const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Upload entry logic
            document.getElementById('uploadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('movieTitle').value;
                const category = document.getElementById('movieCategory').value;
                const streamLink = document.getElementById('streamLink').value;

                const { data, error } = await dbClient
                    .from('movies')
                    .insert([{ title: title, category: category, stream_link: streamLink }]);

                if (error) {
                    alert("Failed to publish movie: " + error.message);
                } else {
                    alert("🎉 Movie successfully published!");
                    document.getElementById('uploadForm').reset();
                    loadAdminMovies();
                }
            });

            // Fetch list into dashboard view
            async function loadAdminMovies() {
                const { data: movies, error } = await dbClient
                    .from('movies')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    document.getElementById('admin-movie-list').innerHTML = "Error loading files.";
                    return;
                }

                const container = document.getElementById('admin-movie-list');
                container.innerHTML = '';

                if (!movies || movies.length === 0) {
                    container.innerHTML = "<p style='color:#888;'>No movies found in the database.</p>";
                    return;
                }

                movies.forEach(movie => {
                    const item = document.createElement('div');
                    item.className = 'movie-list-item';
                    item.innerHTML = `
                        <div class="movie-info">
                            <strong>${movie.title}</strong>
                            <span>Category: ${movie.category}</span>
                        </div>
                        <button class="delete-btn" data-id="${movie.id}">Delete</button>
                    `;
                    container.appendChild(item);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const movieId = e.target.getAttribute('data-id');
                        if (confirm("Are you sure you want to completely delete this movie?")) {
                            try {
                                const res = await fetch(SUPABASE_URL + '/rest/v1/movies?id=eq.' + movieId, {
                                    method: 'DELETE',
                                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                                });
                                if (res.ok) {
                                    alert("🗑️ Movie removed successfully!");
                                    loadAdminMovies();
                                } else {
                                    alert("Failed to delete entry.");
                                }
                            } catch (err) {
                                alert("Network connection error.");
                            }
                        }
                    });
                });
            }

            loadAdminMovies();
        }
    });
</script>
</body>
</html>
