<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub - Private Admin Control</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 40px; }
        .dashboard-box { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; }
        h2 { color: #ff6600; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; color: #ccc; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn { display: block; width: 100%; padding: 12px; background: #ff6600; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #e05500; }
        .status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="dashboard-box">
        <h2>🔐 Admin Control Dashboard</h2>
        <p style="color:#888; font-size:0.9rem;">Upload active Gofile URLs directly to your live database cloud pipeline.</p>
        
        <form id="uploadForm">
            <label>Movie Title:</label>
            <input type="text" id="movieTitle" placeholder="e.g. Ramba Oorvasi Menaka" required>

            <label>Select Category:</label>
            <select id="movieCategory">
                <option value="Tamil Dubbed Movies">Tamil Dubbed Movies</option>
                <option value="Hollywood Movies">Hollywood Movies</option>
                <option value="Bollywood Movies">Bollywood Movies</option>
                <option value="Anime & Cartoons">Anime & Cartoons</option>
            </select>

            <label>Paste Gofile Link:</label>
            <input type="text" id="movieLink" placeholder="e.g. https://gofile.io" required>

            <button type="submit" class="btn">Publish to Cloud Website</button>
        </form>
        <div class="status-msg" id="statusMessage"></div>
    </div>

    <script src="supabase-bridge.js"></script>
    <script>
        let dbClient = null;

        async function initAdmin() {
            const configRes = await fetch('/api/config');
            const config = await configRes.json();
            dbClient = window.supabase.createClient(config.url, config.key);
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('statusMessage');
            msg.innerText = "Publishing link...";
            msg.style.color = "#ff6600";

            let rawLink = document.getElementById('movieLink').value.trim();
            
            // Auto prefix check before database injection
            if (!rawLink.startsWith('http://') && !rawLink.startsWith('https://')) {
                rawLink = 'https://' + rawLink;
            }

            const payload = {
                title: document.getElementById('movieTitle').value.trim(),
                category: document.getElementById('movieCategory').value,
                link: rawLink
            };

            // Use the insert protocol defined on your custom wrapper bridge structure
            const { data, error } = await dbClient.from('movies').insert([payload]);

            if (error) {
                msg.innerText = "❌ Upload Failed: " + error.message;
                msg.style.color = "#ff3333";
            } else {
                msg.innerText = "✅ Successfully Published Live!";
                msg.style.color = "#33cc33";
                document.getElementById('uploadForm').reset();
            }
        });

        initAdmin();
    </script>
</body>
</html>
