<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub - Private Admin Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body style="border-top: 4px solid #ff9900;">
    <header>
        <h1>🔐 Admin Separate Control Dashboard</h1>
        <p>Upload StreamTape links directly to the cloud server database</p>
    </header>

    <main style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <div style="background: #1e1e1e; padding: 20px; border-radius: 8px;">
            <h3>Upload Form</h3>
            <input type="text" id="movieTitle" placeholder="Enter Movie Name" style="width:100%; padding:10px; margin-bottom:15px; box-sizing: border-box;">
            
            <label style="display:block; margin-bottom:5px; color:#aaa;">Select Category:</label>
            <select id="movieCategory" style="width:100%; padding:10px; margin-bottom:15px; background:#333; color:white; border:1px solid #555;">
                <option value="Tamil Dubbed Movies">Tamil Dubbed Movies</option>
                <option value="Hollywood Movies">Hollywood Movies</option>
                <option value="Bollywood Movies">Bollywood Movies</option>
                <option value="Anime & Cartoons">Anime & Cartoons</option>
            </select>

            <label style="display:block; margin-bottom:5px; color:#aaa;">Paste StreamTape Link:</label>
            <input type="text" id="movieUrl" placeholder="Paste StreamTape Download URL here" style="width:100%; padding:10px; margin-bottom:20px; box-sizing: border-box;">
            
            <button onclick="uploadMovie()" style="background:#ff9900; color:black; padding:10px 20px; border:none; font-weight:bold; cursor:pointer; width:100%;">Publish to Cloud Website</button>
        </div>

        <h3 style="margin-top:40px;">Live Database Status</h3>
        <div id="adminMovieGrid"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://wmmwdaracogfvbpnwxgi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbXdkYXJhY29nZnZicG53eGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjIzMzEsImV4cCI6MjEwNzk5ODMzMX0.lQjAcTboJjIm0A8pqGQ1JsGIGcHH1qUfTXE3R8coB3A";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function updateAdminView() {
            const grid = document.getElementById('adminMovieGrid');
            grid.innerHTML = "";
            
            const { data: movies, error } = await supabase.from('movies_list').select('*');
            if (error) return;

            movies.forEach((movie) => {
                grid.innerHTML += `
                    <div style="background:#222; padding:10px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center;">
                        <span><strong>[${movie.category}]</strong> ${movie.title}</span>
                        <button onclick="deleteMovie(${movie.id})" style="background:#cc0000; color:white; border:none; padding:5px 10px; cursor:pointer;">Remove</button>
                    </div>
                `;
            });
        }

        async function uploadMovie() {
            const titleInput = document.getElementById('movieTitle').value.trim();
            const categoryInput = document.getElementById('movieCategory').value;
            const urlInput = document.getElementById('movieUrl').value.trim();

            if (titleInput === "" || urlInput === "") {
                alert("Please fill in all input boxes!");
                return;
            }

            // Pushes data to the global cloud database setup row
            const { error } = await supabase.from('movies_list').insert([
                { title: titleInput, category: categoryInput, fileData: urlInput }
            ]);

            if (error) {
                alert("Cloud database save failed: " + error.message);
            } else {
                alert(`"${titleInput}" is now live on all devices globally!`);
                document.getElementById('movieTitle').value = "";
                document.getElementById('movieUrl').value = "";
                updateAdminView();
            }
        }

        async function deleteMovie(id) {
            await supabase.from('movies_list').delete().eq('id', id);
            updateAdminView();
        }

        updateAdminView();
    </script>
</body>
</html>
