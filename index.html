<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub Clone - Movies Portal</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: #fff; padding: 20px; }
        h1 { color: #E50914; text-align: center; }
        .category-section { margin-bottom: 40px; }
        .category-title { border-bottom: 2px solid #E50914; padding-bottom: 5px; margin-bottom: 15px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .movie-card { background: #2f2f2f; padding: 15px; border-radius: 6px; text-align: center; }
        .watch-btn { display: inline-block; margin-top: 10px; background: #E50914; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>iSaidub Movies</h1>

    <!-- Dynamic Category Sections -->
    <div class="category-section">
        <h2 class="category-title">Tamil Dubbed Movies</h2>
        <div class="movie-grid" id="tamil-movies"></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">Hollywood Movies</h2>
        <div class="movie-grid" id="hollywood-movies"></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">Bollywood Movies</h2>
        <div class="movie-grid" id="bollywood-movies"></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">Anime & Cartoons</h2>
        <div class="movie-grid" id="anime-movies"></div>
    </div>

<script>
    // Use the exact same Supabase credentials here
    const SUPABASE_URL = "https://wmmwdaracogfvbpnwxgi.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtbXdkYXJhY29nZnZicG53eGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjIzMzEsImV4cCI6MjEwNzk5ODMzMX0.lQjAcTboJjIm0A8pqGQ1JsGIGcHH1qUfTXE3R8coB3A";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadMovies() {
        // Fetch all rows from the database table
        const { data: movies, error } = await supabase
            .from('movies')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Error fetching data:", error);
            return;
        }

        // Loop through each item and map it to its container ID
        movies.forEach(movie => {
            const movieElement = document.createElement('div');
            movieElement.className = 'movie-card';
            movieElement.innerHTML = `
                <h3>${movie.title}</h3>
                <a href="${movie.stream_link}" target="_blank" class="watch-btn">Stream / Watch</a>
            `;

            // Sort them layout containers matching the category strings
            if (movie.category === "Tamil Dubbed Movies") {
                document.getElementById('tamil-movies').appendChild(movieElement);
            } else if (movie.category === "Hollywood Movies") {
                document.getElementById('hollywood-movies').appendChild(movieElement);
            } else if (movie.category === "Bollywood Movies") {
                document.getElementById('bollywood-movies').appendChild(movieElement);
            } else if (movie.category === "Anime & Cartoons") {
                document.getElementById('anime-movies').appendChild(movieElement);
            }
        });
    }

    // Trigger load on page startup
    loadMovies();
</script>
</body>
</html>
