<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidub Clone - Movies Portal</title>
    
    <!-- Load the database connection library -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #141414; 
            color: #ffffff; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            color: #E50914; 
            text-align: center; 
            margin-top: 30px;
            font-size: 32px;
        }
        .category-section { 
            max-width: 1000px;
            margin: 40px auto; 
        }
        .category-title { 
            border-bottom: 2px solid #E50914; 
            padding-bottom: 8px; 
            margin-bottom: 20px; 
            font-size: 20px;
            color: #f3f3f3;
        }
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
        }
        .movie-card { 
            background: #222222; 
            padding: 20px; 
            border-radius: 6px; 
            text-align: center; 
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .movie-card h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #fff;
        }
        .watch-btn { 
            display: inline-block; 
            background: #E50914; 
            color: white; 
            padding: 10px 16px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        .watch-btn:hover {
            background: #b80710;
        }
        .loading-text {
            text-align: center;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>iSaidub Movies</h1>

    <!-- Layout structures that match your dropdown options exactly -->
    <div class="category-section">
        <h2 class="category-title">🎬 Tamil Dubbed Movies</h2>
        <div class="movie-grid" id="tamil-movies"><p class="loading-text">Loading movies...</p></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">🎬 Hollywood Movies</h2>
        <div class="movie-grid" id="hollywood-movies"><p class="loading-text">Loading movies...</p></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">🎬 Bollywood Movies</h2>
        <div class="movie-grid" id="bollywood-movies"><p class="loading-text">Loading movies...</p></div>
    </div>

    <div class="category-section">
        <h2 class="category-title">🎬 Anime & Cartoons</h2>
        <div class="movie-grid" id="anime-movies"><p class="loading-text">Loading movies...</p></div>
    </div>

<script>
    // ⚠️ PASTE THE EXACT SAME CREDENTIALS AS YOUR ADMIN PAGE HERE
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; 
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadMovies() {
        // Fetch all rows from your database table order by newest first
        const { data: movies, error } = await dbClient
            .from('movies')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Error reading database rows:", error);
            return;
        }

        // Clear the "Loading movies..." placeholder text before displaying entries
        document.getElementById('tamil-movies').innerHTML = '';
        document.getElementById('hollywood-movies').innerHTML = '';
        document.getElementById('bollywood-movies').innerHTML = '';
        document.getElementById('anime-movies').innerHTML = '';

        // Check if there are no movies in the database yet
        if (!movies || movies.length === 0) {
            const emptyMessage = "<p class='loading-text'>No movies found in this category.</p>";
            document.getElementById('tamil-movies').innerHTML = emptyMessage;
            document.getElementById('hollywood-movies').innerHTML = emptyMessage;
            document.getElementById('bollywood-movies').innerHTML = emptyMessage;
            document.getElementById('anime-movies').innerHTML = emptyMessage;
            return;
        }

        // Loop through each entry returned from the cloud database
        movies.forEach(movie => {
            const movieCard = document.createElement('div');
            movieCard.className = 'movie-card';
            movieCard.innerHTML = `
                <h3>${movie.title}</h3>
                <a href="${movie.stream_link}" target="_blank" class="watch-btn">Stream / Watch</a>
            `;

            // Sort them layout containers matching the category strings exactly
            if (movie.category === "Tamil Dubbed Movies") {
                document.getElementById('tamil-movies').appendChild(movieCard);
            } else if (movie.category === "Hollywood Movies") {
                document.getElementById('hollywood-movies').appendChild(movieCard);
            } else if (movie.category === "Bollywood Movies") {
                document.getElementById('bollywood-movies').appendChild(movieCard);
            } else if (movie.category === "Anime & Cartoons") {
                document.getElementById('anime-movies').appendChild(movieCard);
            }
        });
    }

    // Trigger load instantly on page startup
    loadMovies();
</script>
</body>
</html>
