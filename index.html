<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidon - Live Movie Publisher</title>
    <!-- Supabase JavaScript Library SDK -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-position: center;
            min-height: 100vh;
            width: 100%;
            background-color: #f0e9e9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .out-container {
            background-color: #ffffff;
            min-height: 100vh;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .container {
            background-color: #308bcf;
            display: inline-block;
            padding: 0px;
            width: 100%;
        }
        .normal-container {
            background-color: #308bcf;
            padding: 16px;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        /* Admin Input Styling */
        .admin-box {
            background-color: #246fa8;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 4px;
        }
        .admin-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin: 4px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .admin-box button {
            width: 100%;
            padding: 10px;
            background-color: #00bcd4;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            border-radius: 4px;
        }
        .admin-box button:hover {
            background-color: #0097a7;
        }
        /* Dynamic Folder Layout */
        .folder {
            background-color: #f9f9f9;
            height: auto;
            min-height: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 8px;
            border-bottom: 1px solid #838383;
            margin-top: 0px;
            margin-bottom: 0px;
            display: flex;
            align-items: center;
        }
        .folder a {
            flex-grow: 1;
            font-size: 14px;
            padding: 2px 4px;
            text-align: left;
        }
        .folder img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            padding: 0px 4px;
        }
        a {
            text-decoration: none;
            color: #000000;
            text-align: center; 
            font-size: 14px;
        }
        .folder:hover {
            background-color: #f0f0f0;
            cursor: pointer;
        }
        h1 {
            margin-top: 0em;
            margin-bottom: 0.3em;
            text-align: center;
            color: #ffffff;
        }
        h3 {
            font-weight: normal;
            font-size: 1.3em;
            padding: 0.1em;
            margin-top: 0.3em;
            margin-bottom: 0.3em;
            text-align: center;
            color: #ffffff;
        }
        h4 {
            font-weight: normal;
            font-size: 1em;
            margin-top: 0em;
            margin-bottom: 0.3em;
            text-align: center;
            color: #ffffff;
        }
        .loading-text {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="out-container">
        <div class="container">
            <div class="normal-container">
                <h1>iSaidon</h1>
                <h4>A simple and easy to use text editor</h4>
                
                <!-- Admin Publishing Tool -->
                <div class="admin-box">
                    <h3>Publish Movie Manager</h3>
                    <input type="text" id="movieTitle" placeholder="Movie Name (e.g., MovieName Tamil Dubbed)">
                    <input type="text" id="movieYear" placeholder="Year (e.g., 2026)">
                    <input type="text" id="movieLink" placeholder="Streaming/Download Link URL">
                    <button onclick="publishMovie()">Publish</button>
                </div>
            </div>
        </div>

        <!-- This area updates dynamically without individual coding rows -->
        <div id="movieDisplayArea">
            <div class="loading-text">Connecting to server...</div>
        </div>
    </div>

    <script>
        // Connected to your live database credentials
        const SUPABASE_URL = "https://ussrtmkwasnajfphykby.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzc3J0bWt3YXNuYWpmpGh5a2J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzM2MDEsImV4cCI6MjEwOTcwOTYwMX0.OSMQUulZIHkm8T1sVlNmK5K5IyKDGzCV9WUY1nxLXUM";

        // Initialize connection
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch updates from live server and build folders automatically
        async function displayMovies() {
            const movieContainer = document.getElementById("movieDisplayArea");
            movieContainer.innerHTML = '<div class="loading-text">Loading movies...</div>';

            let { data: movies, error } = await supabase
                .from('movies')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                movieContainer.innerHTML = '<div class="loading-text" style="color:red;">Database Error! Check settings or RLS policies.</div>';
                console.error(error);
                return;
            }

            if (movies.length === 0) {
                movieContainer.innerHTML = '<div class="loading-text">No movies published yet. Use the manager above to add one!</div>';
                return;
            }

            movieContainer.innerHTML = ""; // Wipe container loader
            
            // Generate structured folder list
            movies.forEach(movie => {
                let folderRow = document.createElement("div");
                folderRow.className = "folder";
                
                folderRow.innerHTML = `
                    <img src="https://icons8.com" alt="folder icon">
                    <a href="${movie.link}" target="_blank">${movie.title} (${movie.year})</a>
                `;
                movieContainer.appendChild(folderRow);
            });
        }

        // Single button mechanism to execute publish task
        async function publishMovie() {
            let title = document.getElementById("movieTitle").value;
            let year = document.getElementById("movieYear").value;
            let link = document.getElementById("movieLink").value;

            if (!title || !year || !link) {
                alert("Please complete all configuration fields first!");
                return;
            }

            const { data, error } = await supabase
                .from('movies')
                .insert([{ title, year, link }]);

            if (error) {
                alert("Failed to upload info: " + error.message);
            } else {
                alert("Successfully published online globally!");
                displayMovies(); // Instant structural update
                
                // Clean input views
                document.getElementById("movieTitle").value = "";
                document.getElementById("movieYear").value = "";
                document.getElementById("movieLink").value = "";
            }
        }

        // Run application sequence on launch
        window.onload = displayMovies;
    </script>

</body>
</html>
