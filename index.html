<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSaidon Movies - Movies Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #fff; padding: 30px; margin: 0; }
        h1 { text-align: center; color: #ff6600; font-size: 2.5rem; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; color: #00adef; margin-top: 40px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 15px 0; }
        .movie-card { background: #1a1a1a; border: 1px solid #2d2d2d; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .movie-title { font-size: 1.1rem; margin: 0 0 10px 0; color: #fff; word-break: break-all; }
        .download-btn { display: block; width: 100%; padding: 10px; background: #ff6600; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center; box-sizing: border-box; margin-top: 15px; transition: background 0.2s; }
        .download-btn:hover { background: #e05500; }
    </style>
</head>
<body>

    <h1>🎬 iSaidon Movies Portal</h1>

    <h2>🎬 Tamil Dubbed Movies</h2>
    <div class="gallery" id="tamil-container">Loading movies...</div>

    <h2>🎬 Hollywood Movies</h2>
    <div class="gallery" id="hollywood-container">Loading movies...</div>

    <h2>🎬 Bollywood Movies</h2>
    <div class="gallery" id="bollywood-container">Loading movies...</div>

    <h2>🎬 Anime & Cartoons</h2>
    <div class="gallery" id="anime-container">Loading movies...</div>

    <!-- Load the wrapper bridge first -->
    <script src="supabase-bridge.js"></script>
    <script>
        // Fetch public credentials securely from backend config
        async function initPortal() {
            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                
                // Initialize using your local bridge structure
                const client = window.supabase.createClient(config.url, config.key);
                loadCategoryData(client);
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loadCategoryData(client) {
            // Fetch records from your Supabase 'movies' table ordered by newest
            const { data: movies, error } = await client.from('movies').select('*').order('id', { ascending: false });
            
            if (error) {
                console.error("Database fetch failure:", error);
                return;
            }

            // Reset containers
            const categories = {
                'Tamil Dubbed Movies': document.getElementById('tamil-container'),
                'Hollywood Movies': document.getElementById('hollywood-container'),
                'Bollywood Movies': document.getElementById('bollywood-container'),
                'Anime & Cartoons': document.getElementById('anime-container')
            };

            Object.values(categories).forEach(el => el.innerHTML = '');

            // Render matching database records into containers
            movies.forEach(movie => {
                // Ensure external absolute URL safety for Gofile endpoints
                let targetUrl = movie.link || '#';
                if (targetUrl !== '#' && !targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <h3 class="movie-title">${movie.title}</h3>
                    <a href="${targetUrl}" target="_blank" class="download-btn">📥 Go to Download Page</a>
                `;

                if (categories[movie.category]) {
                    categories[movie.category].appendChild(card);
                }
            });

            // Handle empty containers fallback
            Object.keys(categories).forEach(key => {
                if (categories[key].children.length === 0) {
                    categories[key].innerHTML = '<p style="color: #666;">No media links published yet.</p>';
                }
            });
        }

        initPortal();
    </script>
</body>
</html>
