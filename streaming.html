<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Movie Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            padding: 20px;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 40px; text-shadow: 0 4px 8px rgba(0,0,0,0.9); }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            background: rgba(30, 30, 30, 0.85);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            border: 1px solid #333;
            backdrop-filter: blur(5px);
        }
        video {
            width: 100%;
            border-radius: 4px;
            margin-bottom: 15px;
            background-color: #000;
        }
        .download-btn {
            display: inline-block;
            width: 90%;
            padding: 12px 0;
            background-color: #e50914;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
        }
        .download-btn:hover { background-color: #b80710; }
        .size-tag { color: #ccc; font-size: 13px; margin-top: 8px; }
        .no-movies { font-size: 18px; color: #aaa; margin-top: 50px; }
        .premium-card-dark {
            background-color: #390083;
            color: #00f3ff;
            padding: 40px;
        }
        .title-bar {
            display: inline-block;
            background-color: #07020d;
            padding: 10px 20px;
            font-size: 32px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 4px 8px rgba(0,0,0,0.9);
        }

        /* 1. The container must have position relative */
#movie-container {
    position: relative;
    width: 540px;  /* Match your video width */
    height: 500px; /* Adjust height to fit the title, video, and buttons */
    margin: 0 auto;
}

/* 2. The cards must use absolute positioning to stack perfectly */
.movie-card {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: #030303; /* Ensures the cards underneath are completely blocked out */
    transition: z-index 0.2s ease; /* Makes the switch smooth */
}


    </style>
</head>
<body class="premium-card-dark">
    
    <h1>
        <div class="title-bar">
        iSaidon streaming
        </div>
    </h1>
   
    <hr>


    <h1>🎬 Available Movies for Stream & Download</h1>

    <div class="movie-grid" id="publicGrid"></div>

    <script>
        const Grid = document.getElementById('publicGrid');
        
        // Read the database list created by the Admin page
        const moviesList = JSON.parse(localStorage.getItem('movies')) || [];

        if (moviesList.length === 0) {
            Grid.innerHTML = `<p class="no-movies">No movies have been published yet by the administrator.</p>`;
        } else {
            // Loop through the data and build movie viewers for the public
            moviesList.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';

                card.innerHTML = `
                <div class="movie-card">
                    <h3>${movie.name}</h3>
                    <video width="840" height="460" controls>
                        <source src="${movie.link}" >
                        Your browser does not support the video tag.
                    </video>
                    <a href="${movie.link}" download="${movie.name}.mp4" class="download-btn" onclick="change()">📥 Download Movie</a>
                    
                </div>
                `;

                Grid.appendChild(card);
            });

            
        }
        
      const movieContainer = document.getElementById('movie-container'); // Change to your container ID

movieContainer.addEventListener('play', function(event) {
    if (event.target.tagName === 'Video') {
        const allCards = movieContainer.querySelectorAll('.movie-card');
        const activeCard = event.target.closest('.movie-card');

        allCards.forEach(card => {
            const video = card.querySelector('video');
            
            if (video !== event.target) {
                video.pause(); // Pause all other videos
                card.style.zIndex = "1"; // Push non-playing cards to the back
            }
        });

        // Bring the active video card straight to the front layer
        activeCard.style.zIndex = "10"; 
    }
}, true);


    </script>

</body>
</html>
